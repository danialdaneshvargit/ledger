name: Deploy to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Decode assets (PNG icons + gzipped sources are stored as base64 text so they can be committed via the API)
        run: |
          for f in icons-b64/*.b64; do base64 -d "$f" > "$(basename "${f%.b64}")"; done
          for f in src-b64/*.gz.b64; do base64 -d "$f" | gunzip > "$(basename "${f%.gz.b64}")"; done
          for d in src-b64/*/; do n=$(basename "$d"); cat "$d"* | base64 -d | gunzip > "$n"; done
          ls -la *.png app.js styles.css ledger-data.js
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
